[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  SECRETS_SCAN_OMIT_KEYS = "GOOGLE_API_KEY,GOOGLE_CALENDAR_ID"

# Hero-Video: Segmente ändern sich nie (neues Video = neu encodieren), Playlists kurz cachen
[[headers]]
  for = "/video/*/*.ts"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Content-Type = "video/mp2t"

[[headers]]
  for = "/video/*/*.mp4"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/video/*/*.m3u8"
  [headers.values]
    Cache-Control = "public, max-age=300"
    Content-Type = "application/vnd.apple.mpegurl"

[[headers]]
  for = "/video/*/poster.jpg"
  [headers.values]
    Cache-Control = "public, max-age=86400"
